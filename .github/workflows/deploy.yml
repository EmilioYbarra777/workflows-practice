name: CI / Deploy

on:
  push:
    branches:
      - main            # Merged PR → full CI + prod deploy
      - deploy-worker   # Dev pushes → CI + staging deploy
  pull_request:
    branches:
      - main            # PRs into main → CI only (no deploy)

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1 · Build · Test · Publish coverage artifact · Deploy staging
  # ─────────────────────────────────────────────────────────────────
  ci:
    name: Build, Test & Deploy (Staging)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Worker Types
        run: npm run cf-typegen

      # TypeScript type-check (catches compile errors without emitting files)
      - name: TypeScript build check
        run: npx tsc --noEmit

      - name: Typescript build check (tests)
        run: npx tsc --noEmit -p test/tsconfig.json

      # Run unit tests with V8 coverage reporter
      - name: Run tests with coverage
        run: npm run coverage -- --run --reporter=verbose --coverage.reporter=lcov --coverage.reporter=text

      # Publish coverage report as a downloadable GitHub Actions artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() # Upload even when tests fail so you can inspect failures
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      # Deploy to the default (staging) Cloudflare Worker
      # Only on pushes to deploy-worker (not PRs, not pushes to main)
      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/deploy-worker'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # ─────────────────────────────────────────────────────────────────
  # Job 2 · Deploy to Production (runs only after ci passes)
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    needs: ci # Wait for the CI job to succeed before running
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only on merged PRs to main

    environment:
      name: production
      # Note: secrets are not available in environment.url — use vars.* instead.
      # Add CLOUDFLARE_ACCOUNT_ID as a Variable (not a Secret) in repo Settings
      # to enable this link, or hardcode your account subdomain.
      url: https://workflows-practice-production.gilbertoeybarrai.workers.dev

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production